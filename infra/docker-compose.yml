# Base de datos mínima de Trazo: Postgres + PostgREST (la misma API REST que usa Supabase por debajo).
# Sin Auth, Realtime, Storage, Studio ni Kong: el juego no los necesita. Ver README.md.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    # Ajustes para gastar poca memoria: sobra para unas pocas escrituras por partida.
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB
    volumes:
      - db:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trazo']
      interval: 5s
      timeout: 3s
      retries: 10

  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/trazo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (32 caracteres o más)}
      PGRST_DB_POOL: 4
      PGRST_OPENAPI_MODE: disabled
    ports:
      # Solo en local: publícalo con tu proxy inverso o túnel, igual que bd-mr-white.
      - '127.0.0.1:3010:3000'

volumes:
  db:
